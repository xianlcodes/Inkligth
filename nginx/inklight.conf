upstream backend_tencent {
    server 175.27.171.40:8001;
}
server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name www.inklight.cn inklight.cn;
    # ---- 拦截通过 IP 的访问 ----
    if ($host = '47.108.91.121') {
        return 444;
    }
    # ---- 强制裸域重定向到 www ----
    if ($host = 'inklight.cn') {
        return 301 https://www.inklight.cn$request_uri;
    }
    index index.html index.htm default.htm default.html;
    root /www/wwwroot/inklight/inklight-frontend/dist;
    include /www/server/panel/vhost/nginx/extension/47.108.91.121/*.conf;
    include /www/server/panel/vhost/nginx/well-known/47.108.91.121.conf;
    # ---- SSL 证书配置 ----
    ssl_certificate    /www/server/panel/vhost/cert/47.108.91.121/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/47.108.91.121/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    error_page 497  https://$host$request_uri;
    # ---- 强制 HTTP → HTTPS ----
    set $isRedcert 1;
    if ($server_port != 443) {
        set $isRedcert 2;
    }
    if ( $uri ~ /\.well-known/ ) {
        set $isRedcert 1;
    }
    if ($isRedcert != 1) {
        rewrite ^(/.*)$ https://$host$1 permanent;
    }
    # ---- 静态文件（搜索引擎验证、爬虫协议）----
    location = /robots.txt { }
    location = /baidu_verify_codeva-2GSAc11y9v.html { }
    location = /google7d8b26d9050e0b60.html { }
    # ---- Vue SPA 回退 ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ═══════════════════════════════════════════════
    #  腾讯云 API 转发
    # ═══════════════════════════════════════════════
    location ^~ /api/v1/auth {
        proxy_pass http://backend_tencent;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }
    location ^~ /api/v1/translate {
        proxy_pass http://backend_tencent;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }
    location ^~ /api/v1/literatures {
        proxy_pass http://backend_tencent;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }
    location ^~ /api/v1/search {
        proxy_pass http://backend_tencent;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }
    location ^~ /api/v1/upload {
        proxy_pass http://backend_tencent;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }
    location ^~ /api/v1/tasks {
        proxy_pass http://backend_tencent;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }
    location ^~ /api/v1/featured {
        proxy_pass http://backend_tencent;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }
    location ^~ /api/v1/presentations {
        proxy_pass http://backend_tencent;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }
    location ^~ /api/v1/argument {
        proxy_pass http://backend_tencent;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }
    location ^~ /api/v1/skills {
        proxy_pass http://backend_tencent;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }
    location ^~ /api/v1/users {
        proxy_pass http://backend_tencent;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }
    location ^~ /api/v1/ai-engines {
        proxy_pass http://backend_tencent;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    # ---- 其余 API 仍由阿里云本地处理 ----
    location ^~ /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---- URL 重写规则（宝塔）----
    include /www/server/panel/vhost/rewrite/html_47.108.91.121.conf;
    # ---- 禁止访问敏感文件 ----
    location ~* (\.user.ini|\.htaccess|\.htpasswd|\.env.*|\.project|\.bashrc|\.bash_profile|\.bash_logout|\.DS_Store|\.gitignore|\.gitattributes|LICENSE|README\.md|CLAUDE\.md|CHANGELOG\.md|CHANGELOG|CONTRIBUTING\.md|TODO\.md|FAQ\.md|composer\.json|composer\.lock|package(-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|\.\w+~|\.swp|\.swo|\.bak(up)?|\.old|\.tmp|\.temp|\.log|\.sql(\.gz)?|docker-compose\.yml|docker\.env|Dockerfile|\.csproj|\.sln|Cargo\.toml|Cargo\.lock|go\.mod|go\.sum|phpunit\.xml|phpunit\.xml|pom\.xml|build\.gradl|pyproject\.toml|requirements\.txt|application(-\w+)?\.(ya?ml|properties))$
    {
        return 404;
    }
    # ---- 禁止访问敏感目录 ----
    location ~* /(\.git|\.svn|\.bzr|\.vscode|\.claude|\.idea|\.ssh|\.github|\.npm|\.yarn|\.pnpm|\.cache|\.husky|\.turbo|\.next|\.nuxt|node_modules|runtime)/ {
        return 404;
    }
    # ---- Let's Encrypt 验证目录 ----
    location ~ \.well-known{
        allow all;
    }
    # ---- 禁止在验证目录放入敏感文件 ----
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }
    # ---- 静态资源缓存 ----
    location ~ .*\\.(gif|jpg|jpeg|png|bmp|swf)$ {
        expires      30d;
        error_log /dev/null;
        access_log /dev/null;
    }
    location ~ .*\\.(js|css)?$ {
        expires      -1;
        error_log /dev/null;
        access_log /dev/null;
    }
    access_log  /www/wwwlogs/47.108.91.121.log;
    error_log  /www/wwwlogs/47.108.91.121.error.log;
}
